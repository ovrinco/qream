[package]
license = "Apache-2.0"
name = "qream-install"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[dependencies]
tracker-store = { path = "../tracker-store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
sha2 = { version = "=0.11.0", default-features = false }
chrono = { version = "=0.4.45", features = ["clock", "serde"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
