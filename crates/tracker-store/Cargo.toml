[package]
license = "Apache-2.0"
name = "tracker-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled", "fallible_uint"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
thiserror = "=2.0.19"
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
uuid = { version = "=1.24.0", features = ["v7"] }
rust_xlsxwriter = "=0.104.0"
csv = "=1.4.0"
sha2 = { version = "=0.11.0", default-features = false }
clap = { version = "=4.6.5", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
