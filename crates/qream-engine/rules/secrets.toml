# Secret patterns the house masks (RW-17-R03). Data, read by src/mask.rs at build time.
# A match is replaced by `[masked]` in every pane text, mail body and record the daemon sends;
# a report holding a match is refused by `submit` with its line named.
replacement = "[masked]"

[[pattern]]
name = "anthropic key"
regex = 'sk-ant-[A-Za-z0-9_\-]{20,}'

[[pattern]]
name = "openai key"
regex = 'sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_\-]{20,}'

[[pattern]]
name = "bearer token"
regex = '(?i)\bbearer\s+[A-Za-z0-9._~+/\-]{16,}=*'

[[pattern]]
name = "private key block"
regex = '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z0-9 ]*PRIVATE KEY-----'
